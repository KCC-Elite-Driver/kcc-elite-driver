<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // SPA fallback: store the original path and redirect to index.html
    // This avoids infinite redirect loops when the server returns 404
    var path = window.location.pathname + window.location.search + window.location.hash;
    sessionStorage.setItem('spa-redirect', path);
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
